apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: ca1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
    spec:
      containers:
        - name: pricing
          image: python:3.11-alpine
          command: ["/bin/sh","-c"]
          args:
            - |
              cat >/tmp/server.py <<'PY'
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json

              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      payload = json.dumps({
                          "service": "pricing",
                          "discount_percent": 10,
                          "currency": "EUR"
                      }).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

              HTTPServer(("", 8080), H).serve_forever()
              PY
              python /tmp/server.py
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-svc
  namespace: ca1
spec:
  selector:
    app: pricing
  ports:
    - port: 80
      targetPort: 8080
