apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: ca1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: aq496/checkout:1.0
          imagePullPolicy: Always
          env:
            - name: PRICING_URL
              value: "http://pricing-svc/"
            - name: INVENTORY_URL
              value: "http://inventory-svc/"
            - name: DEP_TIMEOUT
              value: "1500"
            - name: PGHOST
              value: "postgres-svc"
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-svc
  namespace: ca1
spec:
  selector:
    app: checkout
  ports:
    - port: 80
      targetPort: 8080