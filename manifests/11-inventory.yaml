apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: ca1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: aq496/inventory:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-svc
  namespace: ca1
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 8080